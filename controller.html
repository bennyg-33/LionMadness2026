<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Master Controller</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050505; color: #fff; font-family: 'Oswald', sans-serif; text-align: center; padding: 20px; margin: 0; }
    h2 { color: #D4AF37; letter-spacing: 3px; border-bottom: 2px solid #333; padding-bottom: 10px; }
    button { width: 100%; padding: 20px; margin: 10px 0; font-size: 1.5em; border-radius: 5px; border: 2px solid #444; font-family: 'Oswald'; text-transform: uppercase; font-weight: 700; cursor: pointer; transition: 0.2s; background: #111; color: white;}
    
    .btn-team.selected { background-color: #D4AF37; color: #000; border-color: #D4AF37; }
    
    .btn-admin { background-color: #8A0303; color: white; border-color: #ff0000; }
    .btn-advance { background-color: #111; color: white; border-color: #4caf50; font-size: 1.8em; padding: 30px; }
    
    #match-info { color: #aaa; margin-top: 10px; font-size: 1.2em; }
    #host-controls { background: #111; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-top: 30px; }
  </style>
</head>
<body>
  
  <h2>COMMITTEE VOTING</h2>
  <div id="match-info">Loading...</div>
  
  <!-- PHASE: BRACKET -->
  <div id="view-bracket" style="display:none;">
      <h3 style="color:#aaa; margin-top: 50px;">Waiting on Host to start match...</h3>
  </div>

  <!-- PHASE: VOTING -->
  <div id="view-voting" style="display:none;">
      <button id="btn-t1" class="btn-team" onclick="castVote(1)">TEAM 1</button>
      <h3 style="color: #8A0303; margin: 5px;">VS</h3>
      <button id="btn-t2" class="btn-team" onclick="castVote(2)">TEAM 2</button>
  </div>

  <!-- PHASE: REVEAL -->
  <div id="view-reveal" style="display:none;">
      <h1 class="gold-text" style="font-size: 2.5em; color: #D4AF37;">WINNER REVEALED ON TV!</h1>
      <h3 id="winner-name" style="color: #fff;"></h3>
  </div>

  <!-- HOST CONTROLS -->
  <div id="host-controls">
      <h3 style="margin-top:0; color:#8A0303;">--- HOST CONTROLS ---</h3>
      <button id="btn-start-match" onclick="setPhase('VOTING')" style="display:none;" class="btn-admin">📺 ZOOM IN & START VOTING</button>
      <button id="btn-confirm-winner" onclick="confirmWinner()" style="display:none;" class="btn-advance">✅ CONFIRM MAJORITY WINNER</button>
      <button id="btn-next-match" onclick="nextMatch()" style="display:none;" class="btn-admin">⏭️ SHOW BRACKET & NEXT MATCH</button>
      <button id="btn-nuke" class="btn-admin" style="margin-top: 40px; font-size: 1em;" onclick="attemptNuke()">⚠️ NUKE BRACKET</button>
  </div>

  <script src="logic.js"></script>
  <script>
    let myVoterId = localStorage.getItem('lion_voter_id');
    if(!myVoterId) {
        myVoterId = 'voter_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('lion_voter_id', myVoterId);
    }

    let currentMatch = null;
    let currentData = null;
    let myVote = null;

    db.ref('tournament').on('value', (snapshot) => {
      currentData = snapshot.val();
      if(currentData && currentData.matches) {
         currentMatch = currentData.matches[currentData.currentMatchId];
         let votes = currentData.votes || {};
         myVote = votes[myVoterId];

         document.getElementById('match-info').innerText = `MATCH ${currentData.currentMatchId + 1} / 67 | ${currentMatch.t1} vs ${currentMatch.t2}`;

         document.getElementById('view-bracket').style.display = currentData.phase === "BRACKET" ? "block" : "none";
         document.getElementById('view-voting').style.display = currentData.phase === "VOTING" ? "block" : "none";
         document.getElementById('view-reveal').style.display = currentData.phase === "REVEAL" ? "block" : "none";

         document.getElementById('btn-start-match').style.display = currentData.phase === "BRACKET" ? "block" : "none";
         document.getElementById('btn-confirm-winner').style.display = currentData.phase === "VOTING" ? "block" : "none";
         
         let nextBtn = document.getElementById('btn-next-match');
         nextBtn.style.display = currentData.phase === "REVEAL" ? "block" : "none";
         if (currentMatch.id === 66) {
             nextBtn.innerText = "🏆 SHOW CHAMPION PATH";
         } else {
             nextBtn.innerText = "⏭️ SHOW BRACKET & NEXT MATCH";
         }

         if(currentData.phase === "VOTING") {
             document.getElementById('btn-t1').innerText = currentMatch.t1;
             document.getElementById('btn-t2').innerText = currentMatch.t2;
             
             document.getElementById('btn-t1').className = myVote === 1 ? 'btn-team selected' : 'btn-team';
             document.getElementById('btn-t2').className = myVote === 2 ? 'btn-team selected' : 'btn-team';
             
             // Light up Confirm instantly if they have selected someone
             if(myVote !== null && myVote !== undefined) {
                 document.getElementById('btn-confirm-winner').style.backgroundColor = "#D4AF37";
                 document.getElementById('btn-confirm-winner').style.color = "#000";
             } else {
                 document.getElementById('btn-confirm-winner').style.backgroundColor = "#111";
                 document.getElementById('btn-confirm-winner').style.color = "#fff";
             }
         }

         if(currentData.phase === "REVEAL") {
             document.getElementById('winner-name').innerText = currentMatch.winner + " DOMINATES!";
         }
      }
    });

    function setPhase(newPhase) {
        if(newPhase === 'VOTING' && (currentMatch.t1.includes("Waiting") || currentMatch.t2.includes("Waiting"))) {
            alert("Waiting on earlier matches to finish!"); return;
        }
        db.ref('tournament/phase').set(newPhase);
    }

    function castVote(teamNum) {
        db.ref(`tournament/votes/${myVoterId}`).set(teamNum);
    }

    function confirmWinner() {
        if(!myVote) {
            alert("You must tap a team to select the majority winner first!"); return;
        }

        let winnerName = myVote === 1 ? currentMatch.t1 : currentMatch.t2;

        if(confirm(`Majority selects ${winnerName}. Lock it in?`)) {
            db.ref(`tournament/matches/${currentMatch.id}/winner`).set(winnerName);
            if(currentMatch.nextMatch !== undefined) {
                db.ref(`tournament/matches/${currentMatch.nextMatch}/${currentMatch.nextSlot}`).set(winnerName);
            }
            setPhase('REVEAL');
        }
    }

    function nextMatch() {
        if (currentMatch.id < 66) {
            db.ref('tournament').update({
                currentMatchId: currentMatch.id + 1,
                phase: 'BRACKET',
                votes: null
            });
        } else {
            // Trigger the final Championship Phase!
            db.ref('tournament/phase').set('COMPLETE');
        }
    }

    // --- PROTECTED 2-STEP NUKE ---
    let nukeArmed = false;
    function attemptNuke() {
        let btn = document.getElementById('btn-nuke');
        if(!nukeArmed) {
            nukeArmed = true;
            btn.innerText = "⚠️ CONFIRM NUKE? (3s)";
            btn.style.backgroundColor = "#ff0000";
            
            // Defuse after 3 seconds
            setTimeout(() => {
                nukeArmed = false;
                btn.innerText = "⚠️ NUKE BRACKET";
                btn.style.backgroundColor = "#8A0303";
            }, 3000);
        } else {
            // Nuke Executed!
            nukeArmed = false;
            btn.innerText = "⚠️ NUKE BRACKET";
            btn.style.backgroundColor = "#8A0303";
            initializeTournament();
        }
    }
  </script>
</body>
</html>
