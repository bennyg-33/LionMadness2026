<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lion Madness Controller</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050505; color: #fff; font-family: 'Oswald', sans-serif; text-align: center; padding: 20px; margin: 0; }
    h2 { color: #D4AF37; letter-spacing: 3px; border-bottom: 2px solid #333; padding-bottom: 10px; }
    
    input { width: 90%; padding: 20px; font-size: 1.5em; background: #111; color: white; border: 2px solid #444; border-radius: 5px; margin-bottom: 20px; font-family: 'Oswald'; text-align: center; }
    button { width: 100%; padding: 25px; margin: 10px 0; font-size: 1.5em; border-radius: 5px; border: 2px solid #444; font-family: 'Oswald'; text-transform: uppercase; font-weight: 700; cursor: pointer; transition: 0.2s; background: #111; color: white;}
    
    .btn-team.selected { background-color: #ff9800; color: #000; border-color: #ff9800; }
    .btn-lock { background-color: #2e7d32; border-color: #4caf50; font-size: 2em; padding: 35px; box-shadow: 0 0 20px rgba(76, 175, 80, 0.5); display: none; }
    .btn-lock:active { transform: scale(0.95); }
    
    #match-info { color: #aaa; margin-top: 10px; font-size: 1.2em; }
    .status-msg { font-size: 1.8em; color: #D4AF37; margin-top: 50px; line-height: 1.5; }
  </style>
</head>
<body>
  
  <h2>COMMITTEE REMOTE</h2>
  
  <!-- PHASE: REGISTRATION -->
  <div id="view-register" style="display:none;">
      <h3 style="color:#aaa;">Enter your name to join the committee</h3>
      <input type="text" id="voter-name" placeholder="YOUR NAME">
      <button onclick="register()" style="background:#D4AF37; color:#000; border-color:#D4AF37;">JOIN ARENA</button>
  </div>

  <!-- PHASE: BRACKET / WAITING -->
  <div id="view-waiting" style="display:none;">
      <div id="match-info"></div>
      <div class="status-msg" id="waiting-msg">Look at the TV!<br>Waiting for Match to Start...</div>
  </div>

  <!-- PHASE: VOTING -->
  <div id="view-voting" style="display:none;">
      <div id="match-info-vote"></div>
      <button id="btn-t1" class="btn-team" onclick="selectTeam(1)">TEAM 1</button>
      <h3 style="color: #8A0303; margin: 5px;">VS</h3>
      <button id="btn-t2" class="btn-team" onclick="selectTeam(2)">TEAM 2</button>
      <button id="btn-lock" class="btn-lock" onclick="lockIn()">🔒 LOCK IN VOTE</button>
  </div>

  <script src="logic.js"></script>
  <script>
    // CHANGED: Use sessionStorage so every tab gets a unique ID
    let myVoterId = sessionStorage.getItem('lion_voter_id');
    if(!myVoterId) { 
        myVoterId = 'voter_' + Math.random().toString(36).substr(2, 9); 
        sessionStorage.setItem('lion_voter_id', myVoterId); 
    }

    let currentSelection = 0;
    let currentMatch = null;

    db.ref('tournament').on('value', (snapshot) => {
      const data = snapshot.val();
      if(!data) return;
      
      currentMatch = data.matches ? data.matches[data.currentMatchId] : null;
      let myVote = (data.votes && data.votes[myVoterId]) ? data.votes[myVoterId] : null;
      let isRegistered = (data.users && data.users[myVoterId]);

      // Hide everything first
      document.getElementById('view-register').style.display = "none";
      document.getElementById('view-waiting').style.display = "none";
      document.getElementById('view-voting').style.display = "none";

      if(data.phase === "REGISTRATION" && !isRegistered) {
          document.getElementById('view-register').style.display = "block";
          // CHANGED: Use sessionStorage
          sessionStorage.removeItem('lion_voter_name'); 
      } 
      else if (data.phase === "VOTING" && isRegistered) {
          document.getElementById('view-voting').style.display = "block";
          document.getElementById('match-info-vote').innerText = `MATCH ${data.currentMatchId + 1} / 67`;
          
          document.getElementById('btn-t1').innerText = currentMatch.t1;
          document.getElementById('btn-t2').innerText = currentMatch.t2;
          
          // Reset or setup selection UI
          currentSelection = myVote ? myVote.team : 0;
          document.getElementById('btn-t1').className = currentSelection === 1 ? 'btn-team selected' : 'btn-team';
          document.getElementById('btn-t2').className = currentSelection === 2 ? 'btn-team selected' : 'btn-team';

          if(myVote && myVote.locked) {
              document.getElementById('btn-t1').disabled = true; document.getElementById('btn-t2').disabled = true;
              document.getElementById('btn-lock').style.display = "none";
              document.getElementById('match-info-vote').innerHTML += `<br><span style="color:#4caf50; font-weight:bold;">LOCKED IN. Waiting for others...</span>`;
          } else {
              document.getElementById('btn-t1').disabled = false; document.getElementById('btn-t2').disabled = false;
              document.getElementById('btn-lock').style.display = currentSelection !== 0 ? "block" : "none";
          }
      }
      else {
          // Fallback waiting screen (BRACKET, REVEAL, CHAMPION)
          document.getElementById('view-waiting').style.display = "block";
          if(currentMatch) document.getElementById('match-info').innerText = `NEXT: ${currentMatch.t1} vs ${currentMatch.t2}`;
          
          if(data.phase === "REVEAL") document.getElementById('waiting-msg').innerHTML = `<span style="color:#D4AF37; font-size:1.5em">${currentMatch.winner} WINS!</span><br>Wait for TV...`;
          else if(data.phase === "CHAMPION_CELEBRATION" || data.phase === "PATH_HIGHLIGHT") document.getElementById('waiting-msg').innerText = "TOURNAMENT COMPLETE!";
          else document.getElementById('waiting-msg').innerText = "Look at the TV!\nWaiting for Match to Start...";
      }
    });

    function register() {
       let name = document.getElementById('voter-name').value.trim();
       if(name === "") { alert("Enter a name!"); return; }
       db.ref(`tournament/users/${myVoterId}`).set(name);
       // CHANGED: Use sessionStorage
       sessionStorage.setItem('lion_voter_name', name);
    }

    function selectTeam(teamNum) {
       currentSelection = teamNum;
       db.ref(`tournament/votes/${myVoterId}`).set({ team: teamNum, locked: false });
    }

    function lockIn() {
       if (currentSelection !== 0) {
           db.ref(`tournament/votes/${myVoterId}`).set({ team: currentSelection, locked: true });
       }
    }
  </script>
</body>
</html>
