<!DOCTYPE html>
<html>
<head>
  <meta name="referrer" content="no-referrer">
  <title>Lion Madness '26 - THE ARENA</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050505; color: #fff; font-family: 'Oswald', sans-serif; text-align: center; margin: 0; overflow: hidden; }
    .gold-text { color: #D4AF37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); text-transform: uppercase; letter-spacing: 4px; margin: 5px 0; }
    .blood-text { color: #8A0303; text-shadow: 0 0 10px rgba(138, 3, 3, 0.8); }
    
    .voter-card { background: #111; border: 2px solid #444; padding: 10px; border-radius: 5px; font-size: 1vw; text-transform: uppercase; display: flex; flex-direction: column; opacity: 0.8;}
    .voter-card.thinking { border-color: #ff9800; opacity: 1; box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);}
    .voter-card.locked { border-color: #4caf50; opacity: 1; box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);}

    .champ-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(5,5,5,1) 80%); z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 1s; }
    .champ-overlay.active { opacity: 1; pointer-events: all; }
    #champ-img { width: 400px; height: 400px; object-fit: cover; border-radius: 50%; border: 5px solid #D4AF37; box-shadow: 0 0 100px rgba(212, 175, 55, 0.8); margin: 30px 0; }

    #matchup-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; background: rgba(5,5,5,0.95); opacity: 0; pointer-events: none; transition: opacity 0.8s; display: flex; flex-direction: column; justify-content: center; }
    #matchup-view.visible { opacity: 1; pointer-events: all; }
    .matchup-container { display: flex; justify-content: space-around; align-items: center; padding: 0 5%; margin-top: 20px;}
    
    .competitor { font-size: 3em; font-weight: 700; background: linear-gradient(145deg, #111, #000); padding: 30px; border-radius: 10px; width: 35%; border: 2px solid #333; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); text-transform: uppercase; transition: 0.5s; }
    .competitor.winner-highlight { border-color: #D4AF37; box-shadow: 0 0 50px rgba(212, 175, 55, 0.8); transform: scale(1.05); z-index: 60;}
    .competitor img { width: 100%; height: 350px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; border: 2px solid #222; }
    
    #zoom-wrapper { width: 100vw; height: 100vh; position: relative; will-change: transform; transform-origin: center center;}
    
    #first-four-bar { display: flex; justify-content: center; gap: 15px; background: #0a0a0a; border-bottom: 2px solid #D4AF37; padding: 10px; }
    #first-four-bar .match-box { width: 18vw; font-size: 0.8vw; margin-bottom: 0; }
    
    #bracket-arena { display: flex; justify-content: space-between; width: 98vw; height: 85vh; margin: 10px auto 0 auto; }
    .bracket-half { display: flex; width: 42%; justify-content: space-between; }
    .bracket-half.right { flex-direction: row-reverse; }
    .round-col { display: flex; flex-direction: column; justify-content: space-around; flex: 1; margin: 0 3px; }
    
    .match-box { background: #111; border: 1px solid #444; border-radius: 4px; padding: 3px; font-size: 0.75vw; text-transform: uppercase; position: relative; margin-bottom: 5px; transition: opacity 0.5s;}
    .match-box.active-match { border-color: #D4AF37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); z-index: 10; }
    .match-box.completed { border-color: #D4AF37; opacity: 0.8; }
    .match-box.dimmed { opacity: 0.2; border-color: #222; }
    .match-box.champ-path { opacity: 1; border-color: #D4AF37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); }
    
    .team-line { display: flex; align-items: center; border-bottom: 1px solid #333; padding-bottom: 2px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; }
    .team-avatar { width: 1.5vw; height: 1.5vw; border-radius: 50%; margin-right: 8px; object-fit: cover; border: 1px solid #D4AF37; }
    .winner-text { color: #D4AF37; font-weight: bold; }
    
    .center-stage { width: 15%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
    .center-match { width: 100%; background: #111; border: 2px solid #D4AF37; padding: 10px; font-size: 1vw; text-align: left; }

    .audio-controls { position: fixed; bottom: 10px; right: 10px; display: flex; gap: 10px; z-index: 300; }
    button { background: #111; color: #D4AF37; border: 1px solid #D4AF37; padding: 10px 15px; font-family: 'Oswald'; cursor: pointer; text-transform: uppercase; font-weight: bold;}
    button.btn-danger { color: #ff5252; border-color: #ff5252; }
    .nuke-active { filter: invert(1) hue-rotate(180deg); animation: shake 0.5s infinite; }
    @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
  </style>
</head>
<body>
  
  <audio id="bg-music" loop src="bg-music.mp3"></audio>
  <audio id="cheer-sfx" src="cheer.mp3"></audio>

  <!-- Live Committee Panel -->
  <div id="committee-panel" style="position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 100;"></div>

  <!-- Championship Celebration Overlay -->
  <div id="champion-screen" class="champ-overlay">
      <h1 class="gold-text" style="font-size: 6em;">TOURNAMENT CHAMPION</h1>
      <img id="champ-img" src="">
      <h2 id="champ-name" class="gold-text" style="font-size: 4em;"></h2>
  </div>

  <!-- BRACKET VIEW (Base Layer inside Zoom Wrapper) -->
  <div id="zoom-wrapper">
      <h1 id="main-title" class="gold-text" style="font-size: 2em; margin: 5px 0;">LION MADNESS '26</h1>
      
      <!-- FIRST FOUR UI -->
      <div id="first-four-bar">
          <div style="color:#D4AF37; font-size:1.2vw; align-self:center; font-weight:bold;">FIRST FOUR<br>PLAY-IN</div>
          <div id="ff-matches" style="display:flex; gap:10px;"></div>
      </div>

      <!-- MAIN BRACKET GRID -->
      <div id="bracket-arena">
          <div class="bracket-half left" id="left-half"></div>
          <div class="center-stage" id="center-stage"></div>
          <div class="bracket-half right" id="right-half"></div>
      </div>
  </div>

  <!-- MATCHUP VIEW (Overlay Layer) -->
  <div id="matchup-view">
      <h1 class="gold-text" style="font-size: 4em; margin: 0;" id="arena-title">DOMINATION ARENA</h1>
      <div class="matchup-container">
        <div id="active-t1" class="competitor">
            <img id="img-active-t1" src="">
            <div id="name-active-t1">TBD</div>
        </div>
        <div class="blood-text" style="font-size: 5em; font-style: italic; z-index: 10;">VS</div>
        <div id="active-t2" class="competitor">
            <img id="img-active-t2" src="">
            <div id="name-active-t2">TBD</div>
        </div>
      </div>
  </div>

  <div class="audio-controls">
      <button id="btn-bgm" onclick="toggleBGM()">🔊 BGM</button>
      <button id="btn-nuke" class="btn-danger" onclick="handleNuke()">⚠️ NUKE BRACKET</button>
      <button id="btn-main-action" onclick="handleMainAction()" style="display:none; background:#D4AF37; color:#000; font-size:1.2em; border:none; box-shadow: 0 0 15px rgba(212,175,55,0.6);"></button>
  </div>

  <script src="logic.js"></script>
  <script>
    function toggleBGM() {
        const bgm = document.getElementById('bg-music');
        if(bgm.paused) { bgm.play(); } else { bgm.pause(); }
    }

    // Bracket DOM Generation
    function generateMatchBox(i) {
        return `<div class="match-box" id="match-${i}">
            <div class="team-line" id="m${i}-t1-box"><img src="" class="team-avatar" id="m${i}-t1-img" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'"><span id="m${i}-t1-name"></span></div>
            <div class="team-line" id="m${i}-t2-box" style="border:none; margin:0; padding:0;"><img src="" class="team-avatar" id="m${i}-t2-img" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'"><span id="m${i}-t2-name"></span></div>
        </div>`;
    }

    function generateColumn(startIdx, endIdx) {
        let col = document.createElement('div');
        col.className = 'round-col';
        for(let i=startIdx; i<=endIdx; i++) col.innerHTML += generateMatchBox(i);
        return col;
    }

    // First Four
    let ffContainer = document.getElementById('ff-matches');
    for(let i=0; i<=3; i++) ffContainer.innerHTML += generateMatchBox(i);

    // Main Bracket
    document.getElementById('left-half').append(generateColumn(4, 19), generateColumn(36, 43), generateColumn(52, 55), generateColumn(60, 61));
    document.getElementById('right-half').append(generateColumn(20, 35), generateColumn(44, 51), generateColumn(56, 59), generateColumn(62, 63));
    document.getElementById('center-stage').innerHTML = `
        <h3 class="gold-text" style="margin:0;">FINAL FOUR</h3>
        <div class="center-match" id="match-64"><div class="team-line"><img src="" class="team-avatar" id="m64-t1-img"><span id="m64-t1-name"></span></div><div class="team-line" style="border:none;"><img src="" class="team-avatar" id="m64-t2-img"><span id="m64-t2-name"></span></div></div>
        <div class="center-match" id="match-65"><div class="team-line"><img src="" class="team-avatar" id="m65-t1-img"><span id="m65-t1-name"></span></div><div class="team-line" style="border:none;"><img src="" class="team-avatar" id="m65-t2-img"><span id="m65-t2-name"></span></div></div>
        <h2 class="blood-text" style="margin:20px 0 0 0;">CHAMPIONSHIP</h2>
        <div class="center-match" id="match-66" style="border-color:#8A0303; padding:20px;"><div class="team-line"><img src="" class="team-avatar" id="m66-t1-img"><span id="m66-t1-name"></span></div><div class="team-line" style="border:none;"><img src="" class="team-avatar" id="m66-t2-img"><span id="m66-t2-name"></span></div></div>
    `;

    // Rewritten Flawless Zoom Logic (YOUR EXACT CODE)
    const zoomWrapper = document.getElementById('zoom-wrapper');
    function zoomToMatch(matchId) {
        const matchEl = document.getElementById(`match-${matchId}`);
        if(!matchEl) return;
        
        // 1. Reset scale to get perfect native browser coordinates
        zoomWrapper.style.transition = 'none'; 
        zoomWrapper.style.transform = 'translate(0px, 0px) scale(1)';
        void zoomWrapper.offsetWidth; // Force CSS flush
        
        // 2. Find exact center of the specific matchup box
        const rect = matchEl.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        // 3. Find the exact center of the TV Screen
        const screenCenterX = window.innerWidth / 2;
        const screenCenterY = window.innerHeight / 2;
        
        // 4. Set the origin of the transform exactly to the box
        zoomWrapper.style.transformOrigin = `${centerX}px ${centerY}px`;
        
        // 5. Shift the container so the origin lands on the screen center, THEN scale up!
        const moveX = screenCenterX - centerX;
        const moveY = screenCenterY - centerY;
        
        zoomWrapper.style.transition = 'transform 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
        zoomWrapper.style.transform = `translate(${moveX}px, ${moveY}px) scale(3.5)`;
    }
    
    function zoomOut() {
        zoomWrapper.style.transition = 'transform 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
        zoomWrapper.style.transform = `translate(0px, 0px) scale(1)`;
    }

    // Nuke System
    let nukeClicks = 0;
    function handleNuke() {
        if(nukeClicks === 0) {
            document.getElementById('btn-nuke').innerText = "CONFIRM NUKE?";
            nukeClicks++; 
            setTimeout(() => { nukeClicks = 0; document.getElementById('btn-nuke').innerText = "⚠️ NUKE BRACKET"; }, 3000);
        } else {
            document.body.classList.add('nuke-active');
            setTimeout(() => { 
                document.body.classList.remove('nuke-active'); 
                if(typeof initializeTournament === "function") initializeTournament(); 
            }, 1500);
            nukeClicks = 0;
        }
    }

    let globalState = null;
    let calculatingWinner = false;

    // Manual Operator Logic
    function handleMainAction() {
        if(!globalState) return;
        if(globalState.phase === "REGISTRATION") {
            db.ref('tournament/phase').set("BRACKET");
        } else if (globalState.phase === "BRACKET") {
            let m = globalState.matches[globalState.currentMatchId];
            if(m.t1.includes("Waiting") || m.t2.includes("Waiting")) { alert("Cannot start. Waiting on previous matches."); return; }
            db.ref('tournament/phase').set("VOTING");
        } else if (globalState.phase === "REVEAL") {
            db.ref('tournament').update({ currentMatchId: globalState.currentMatchId + 1, phase: "BRACKET", votes: null });
        } else if (globalState.phase === "CHAMPION_CELEBRATION") {
            db.ref('tournament/phase').set("PATH_HIGHLIGHT");
        }
    }

    let lastPhase = "";
    let lastMatchId = -1;

    db.ref('tournament').on('value', (snapshot) => {
      const data = snapshot.val();
      if(!data || !data.matches) return;
      globalState = data;

      const activeMatch = data.matches[data.currentMatchId];

      // Update TV Operator Buttons based on Phase
      let actionBtn = document.getElementById('btn-main-action');
      actionBtn.style.display = "block"; 
      
      if(data.phase === "REGISTRATION") {
          actionBtn.innerText = "START TOURNAMENT"; 
          document.getElementById('main-title').innerText = `REGISTRATION OPEN - ${Object.keys(data.users || {}).length} Joined`;
      } else if(data.phase === "BRACKET") {
          actionBtn.innerText = "ZOOM IN & START VOTE"; 
          document.getElementById('main-title').innerText = "LION MADNESS '26";
      } else if(data.phase === "REVEAL") {
          actionBtn.innerText = "NEXT MATCH"; 
      } else if(data.phase === "CHAMPION_CELEBRATION") {
          actionBtn.innerText = "SHOW GLORY PATH";
      } else {
          actionBtn.style.display = "none"; 
      }

      // Update Committee Panel UI Live
      let cPanel = document.getElementById('committee-panel');
      if(cPanel) {
          cPanel.innerHTML = "";
          Object.keys(data.users || {}).forEach(uid => {
              let name = data.users[uid];
              let vote = (data.votes && data.votes[uid]) ? data.votes[uid] : null;
              let css = "", text = "WAITING";
              if(vote && !vote.locked) { css = "thinking"; text = "SELECTED..."; }
              if(vote && vote.locked) { css = "locked"; text = "LOCKED IN"; }
              cPanel.innerHTML += `<div class="voter-card ${css}"><b>${name}</b> <span style="font-size:0.6em">${text}</span></div>`;
          });
      }

      // Fill Bracket Text and Images (Now loops from 0 so First Four is included!)
      data.matches.forEach((m, i) => {
          let box = document.getElementById(`match-${i}`);
          if(box) {
              document.getElementById(`m${i}-t1-name`).innerText = m.t1;
              if (typeof getImageUrl === "function") {
                  document.getElementById(`m${i}-t1-img`).src = getImageUrl(m.t1);
                  document.getElementById(`m${i}-t2-img`).src = getImageUrl(m.t2);
              }
              document.getElementById(`m${i}-t2-name`).innerText = m.t2;
              
              box.className = 'match-box';
              document.getElementById(`m${i}-t1-box`).classList.remove('winner-text');
              document.getElementById(`m${i}-t2-box`).classList.remove('winner-text');

              if (i === data.currentMatchId) box.classList.add('active-match');
              if (m.winner) {
                  box.classList.add('completed');
                  if(m.winner === m.t1) document.getElementById(`m${i}-t1-box`).classList.add('winner-text');
                  if(m.winner === m.t2) document.getElementById(`m${i}-t2-box`).classList.add('winner-text');
              }
          }
      });

      // VOTE LOCK-IN AUTO-CALCULATION
      if(data.phase === "VOTING" && data.users) {
          let userIds = Object.keys(data.users);
          let allLocked = true; let t1Votes = 0, t2Votes = 0;
          userIds.forEach(uid => {
              let v = (data.votes || {})[uid];
              if(!v || !v.locked) allLocked = false;
              else { if(v.team === 1) t1Votes++; if(v.team === 2) t2Votes++; }
          });

          if(allLocked && userIds.length > 0 && !calculatingWinner) {
              calculatingWinner = true;
              let winner = t1Votes > t2Votes ? activeMatch.t1 : activeMatch.t2;
              if(t1Votes === t2Votes) winner = activeMatch.t1; // Tie-breaker fallback

              let updates = {};
              updates[`matches/${activeMatch.id}/winner`] = winner;
              if(activeMatch.nextMatch !== undefined) updates[`matches/${activeMatch.nextMatch}/${activeMatch.nextSlot}`] = winner;
              updates['phase'] = (activeMatch.id === 66) ? 'CHAMPION_CELEBRATION' : 'REVEAL';

              db.ref('tournament').update(updates);
              setTimeout(() => { calculatingWinner = false; }, 2000);
          }
      }

      // Phase Transition Cinematics
      if (data.phase !== lastPhase || data.currentMatchId !== lastMatchId) {
          
          const champScreen = document.getElementById('champion-screen');
          if(champScreen) champScreen.classList.remove('active');

          if(data.phase === "REGISTRATION") {
              document.getElementById('matchup-view').classList.remove('visible');
              document.querySelectorAll('.match-box').forEach(el => { el.classList.remove('dimmed'); el.classList.remove('champ-path'); });
              zoomOut();
          }

          if(data.phase === "BRACKET") {
              document.getElementById('matchup-view').classList.remove('visible');
              if (lastPhase === "REVEAL") {
                  zoomToMatch(lastMatchId);
                  setTimeout(() => zoomOut(), 300); 
              } else {
                  zoomOut();
              }
          }
          
          if(data.phase === "VOTING") {
              document.getElementById('name-active-t1').innerText = activeMatch.t1;
              if (typeof getImageUrl === "function") {
                  document.getElementById('img-active-t1').src = getImageUrl(activeMatch.t1);
                  document.getElementById('img-active-t2').src = getImageUrl(activeMatch.t2);
              }
              document.getElementById('name-active-t2').innerText = activeMatch.t2;
              
              document.getElementById('active-t1').classList.remove('winner-highlight');
              document.getElementById('active-t2').classList.remove('winner-highlight');
              document.getElementById('arena-title').innerText = "VOTING OPEN";

              // Cinematic: Zoom in on bracket, then fade to Arena
              zoomToMatch(data.currentMatchId);
              setTimeout(() => {
                  document.getElementById('matchup-view').classList.add('visible');
              }, 1500);
          }

          if(data.phase === "REVEAL") {
              document.getElementById('arena-title').innerText = "ALPHA CROWNED";
              let sfx = document.getElementById('cheer-sfx');
              sfx.currentTime = 0; sfx.play().catch(e=>console.log(e));

              if(activeMatch.winner === activeMatch.t1) document.getElementById('active-t1').classList.add('winner-highlight');
              else document.getElementById('active-t2').classList.add('winner-highlight');
          }

          if(data.phase === "CHAMPION_CELEBRATION") {
              document.getElementById('matchup-view').classList.remove('visible');
              document.getElementById('champ-name').innerText = activeMatch.winner;
              if (typeof getImageUrl === "function") {
                  document.getElementById('champ-img').src = getImageUrl(activeMatch.winner);
              }
              
              let sfx = document.getElementById('cheer-sfx'); 
              if(sfx) { sfx.currentTime = 0; sfx.play().catch(e=>console.log(e)); }
              
              setTimeout(() => { if(champScreen) champScreen.classList.add('active'); }, 500);
          }

          if(data.phase === "PATH_HIGHLIGHT") {
              zoomOut();
              let champ = data.matches[66].winner;
              document.querySelectorAll('.match-box').forEach(el => el.classList.add('dimmed'));
              data.matches.forEach(m => {
                  if(m.t1 === champ || m.t2 === champ) {
                      let box = document.getElementById(`match-${m.id}`);
                      if(box) { box.classList.remove('dimmed'); if(m.winner === champ) box.classList.add('champ-path'); }
                  }
              });
          }

          lastPhase = data.phase;
          lastMatchId = data.currentMatchId;
      }
    });
  </script>
</body>
</html>
