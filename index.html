<!DOCTYPE html>
<html>
<head>
  <meta name="referrer" content="no-referrer"> 
  <title>Lion Madness '26 - THE ARENA</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050505; color: #fff; font-family: 'Oswald', sans-serif; text-align: center; margin: 0; overflow: hidden; transition: 0.3s; }
    .gold-text { color: #D4AF37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); text-transform: uppercase; letter-spacing: 4px; margin: 5px 0; }
    .blood-text { color: #8A0303; text-shadow: 0 0 10px rgba(138, 3, 3, 0.8); }
    
    /* Overlay Arena View */
    #matchup-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; background: rgba(5,5,5,0.95); opacity: 0; pointer-events: none; transition: opacity 0.8s; display: flex; flex-direction: column; justify-content: center; }
    #matchup-view.visible { opacity: 1; pointer-events: all; }
    .matchup-container { display: flex; justify-content: space-around; align-items: center; padding: 0 5%; margin-top: 20px;}
    
    .competitor { font-size: 3em; font-weight: 700; background: linear-gradient(145deg, #111, #000); padding: 30px; border-radius: 10px; width: 35%; border: 2px solid #333; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); text-transform: uppercase; transition: 0.5s; position: relative; }
    .competitor.winner-highlight { border-color: #D4AF37; box-shadow: 0 0 50px rgba(212, 175, 55, 0.8); transform: scale(1.05); z-index: 60;}
    .competitor img { width: 100%; height: 35vh; object-fit: cover; border-radius: 5px; margin-bottom: 15px; border: 2px solid #222; background: #111;}
    
    #zoom-wrapper { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; will-change: transform; transform-origin: 0 0; transition: filter 1s; }
    #first-four-bar { display: flex; justify-content: center; gap: 15px; background: #0a0a0a; border-bottom: 2px solid #D4AF37; padding: 10px; }
    #first-four-bar .match-box { width: 18vw; font-size: 0.8vw; margin-bottom: 0; }
    #bracket-arena { display: flex; justify-content: space-between; width: 98vw; height: 85vh; margin: 10px auto 0 auto; }
    .bracket-half { display: flex; width: 42%; justify-content: space-between; }
    .bracket-half.right { flex-direction: row-reverse; }
    .round-col { display: flex; flex-direction: column; justify-content: space-around; flex: 1; margin: 0 3px; }
    
    .match-box { background: #111; border: 1px solid #444; border-radius: 4px; padding: 3px; font-size: 0.75vw; text-transform: uppercase; margin-bottom: 5px; transition: 0.5s; }
    .match-box.active-match { border-color: #D4AF37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); z-index: 10; }
    .match-box.completed { border-color: #D4AF37; opacity: 0.8; }
    .team-line { display: flex; align-items: center; border-bottom: 1px solid #333; padding-bottom: 2px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; }
    .team-avatar { width: 1.5vw; height: 1.5vw; border-radius: 50%; margin-right: 8px; object-fit: cover; border: 1px solid #D4AF37; background: #000; }
    .winner-text { color: #D4AF37; font-weight: bold; }
    
    .center-stage { width: 15%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
    .center-match { width: 100%; background: #111; border: 2px solid #D4AF37; padding: 10px; font-size: 1vw; text-align: left; transition: 0.5s; }

    #tv-controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid #333; }
    button { background: #111; color: #D4AF37; border: 1px solid #D4AF37; padding: 15px 30px; font-family: 'Oswald'; cursor: pointer; text-transform: uppercase; font-weight: bold; font-size: 1.2em; transition: 0.3s; }
    button:hover { background: #D4AF37; color: #000; }
    .btn-danger { color: #ff4444; border-color: #ff4444; }
    .btn-danger:hover { background: #ff4444; color: white; }

    #committee-panel { position: absolute; bottom: 5vh; width: 100%; display: flex; justify-content: center; gap: 20px; }
    .voter-card { background: #111; padding: 10px 20px; border-radius: 5px; border: 2px solid #333; font-size: 1.5em; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
    .voter-card.thinking { border-color: #ff9800; box-shadow: 0 0 15px rgba(255,152,0,0.5); animation: pulse 1.5s infinite; }
    .voter-card.locked { border-color: #4caf50; background: #1b3320; color: #a5d6a7; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes nukeShake {
        0% { transform: translate(2px, 2px) rotate(0deg); } 20% { transform: translate(-2px, -2px) rotate(-1deg); }
        40% { transform: translate(-3px, 2px) rotate(1deg); } 60% { transform: translate(3px, -2px) rotate(0deg); }
        80% { transform: translate(2px, -3px) rotate(-1deg); } 100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    .nuke-active { animation: nukeShake 0.3s infinite; filter: invert(1) hue-rotate(180deg) contrast(200%); }

    /* Path Highlight CSS */
    .dimmed { opacity: 0.1 !important; filter: grayscale(100%); }
    .champ-path { border-color: #D4AF37 !important; background: #221a00 !important; box-shadow: 0 0 20px #D4AF37 !important; z-index: 20; transform: scale(1.05); }

    #champion-screen { position: absolute; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 1s; }
    #champion-screen.active { opacity: 1; pointer-events: all; }
    #champ-img { width: 30vw; border: 5px solid #D4AF37; box-shadow: 0 0 100px #D4AF37; border-radius: 20px; }
  </style>
</head>
<body>
  
  <audio id="bg-music" loop src="bg-music.mp3"></audio>
  <audio id="cheer-sfx" src="cheer.mp3"></audio>
  
  <div id="zoom-wrapper">
      <h1 class="gold-text" style="font-size: 2em; margin: 5px 0; text-align: center;" id="main-title">LION MADNESS '26</h1>
      <div id="first-four-bar">
          <div style="color:#D4AF37; font-size:1.2vw; align-self:center; font-weight:bold;">FIRST FOUR<br>PLAY-IN</div>
          <div id="ff-matches" style="display:flex; gap:10px;"></div>
      </div>
      <div id="bracket-arena">
          <div class="bracket-half left" id="left-half"></div>
          <div class="center-stage" id="center-stage"></div>
          <div class="bracket-half right" id="right-half"></div>
      </div>
  </div>

  <div id="matchup-view">
      <h1 class="gold-text" style="font-size: 4em; margin: 0;" id="arena-title">DOMINATION ARENA</h1>
      <div class="matchup-container">
        <div id="active-t1" class="competitor"><img id="img-active-t1" src=""><div id="name-active-t1">TBD</div></div>
        <div class="blood-text" style="font-size: 5em; font-style: italic; z-index: 10;">VS</div>
        <div id="active-t2" class="competitor"><img id="img-active-t2" src=""><div id="name-active-t2">TBD</div></div>
      </div>
      <div id="committee-panel"></div>
  </div>

  <div id="champion-screen">
      <h1 class="gold-text" style="font-size: 6em; margin-bottom: 20px; text-shadow: 0 0 50px #D4AF37;">ULTIMATE CHAMPION</h1>
      <img id="champ-img" src="">
      <h2 id="champ-name" style="font-size: 4em; margin-top: 20px;">TBD</h2>
  </div>

  <!-- TV Master Console -->
  <div id="tv-controls">
      <button id="btn-bgm" onclick="toggleBGM()">🔊 BGM</button>
      <button id="btn-nuke" class="btn-danger" onclick="handleNuke()">⚠️ NUKE BRACKET</button>
      <button id="btn-main-action" onclick="handleMainAction()" style="display:none;"></button>
  </div>

  <script src="logic.js"></script>
  <script>
    function toggleBGM() {
        const bgm = document.getElementById('bg-music');
        if(bgm.paused) { bgm.play(); } else { bgm.pause(); }
    }

    function generateMatchBox(i) {
        return `<div class="match-box" id="match-${i}">
            <div class="team-line" id="m${i}-t1-box"><img src="" class="team-avatar" id="m${i}-t1-img"><span id="m${i}-t1-name"></span></div>
            <div class="team-line" id="m${i}-t2-box" style="border:none; margin:0; padding:0;"><img src="" class="team-avatar" id="m${i}-t2-img"><span id="m${i}-t2-name"></span></div>
        </div>`;
    }

    function generateColumn(startIdx, endIdx) {
        let col = document.createElement('div'); col.className = 'round-col';
        for(let i=startIdx; i<=endIdx; i++) col.innerHTML += generateMatchBox(i); return col;
    }

    let ffContainer = document.getElementById('ff-matches');
    for(let i=0; i<=3; i++) ffContainer.innerHTML += generateMatchBox(i);
    document.getElementById('left-half').append(generateColumn(4, 19), generateColumn(36, 43), generateColumn(52, 55), generateColumn(60, 61));
    document.getElementById('right-half').append(generateColumn(20, 35), generateColumn(44, 51), generateColumn(56, 59), generateColumn(62, 63));
    document.getElementById('center-stage').innerHTML = `
        <h3 class="gold-text" style="margin:0;">FINAL FOUR</h3>
        <div class="center-match" id="match-64"><div class="team-line"><img src="" class="team-avatar" id="m64-t1-img"><span id="m64-t1-name"></span></div><div class="team-line" style="border:none;"><img src="" class="team-avatar" id="m64-t2-img"><span id="m64-t2-name"></span></div></div>
        <div class="center-match" id="match-65"><div class="team-line"><img src="" class="team-avatar" id="m65-t1-img"><span id="m65-t1-name"></span></div><div class="team-line" style="border:none;"><img src="" class="team-avatar" id="m65-t2-img"><span id="m65-t2-name"></span></div></div>
        <h2 class="blood-text" style="margin:20px 0 0 0;">CHAMPIONSHIP</h2>
        <div class="center-match" id="match-66" style="border-color:#8A0303; padding:20px;"><div class="team-line"><img src="" class="team-avatar" id="m66-t1-img"><span id="m66-t1-name"></span></div><div class="team-line" style="border:none;"><img src="" class="team-avatar" id="m66-t2-img"><span id="m66-t2-name"></span></div></div>
    `;

    const zoomWrapper = document.getElementById('zoom-wrapper');
    function zoomToMatch(matchId) {
        const matchEl = document.getElementById(`match-${matchId}`);
        if(!matchEl) return;
        
        // 1. Strip transition and fix origin to top-left (0,0) immediately
        zoomWrapper.style.transition = 'none'; 
        zoomWrapper.style.transform = 'translate(0px, 0px) scale(1)';
        zoomWrapper.style.transformOrigin = '0 0';
        
        // 2. Give the browser a tiny 50ms window to fully flush the layout reset
        setTimeout(() => {
            const wrapperRect = zoomWrapper.getBoundingClientRect();
            const matchRect = matchEl.getBoundingClientRect();
            
            const centerX = (matchRect.left - wrapperRect.left) + (matchRect.width / 2);
            const centerY = (matchRect.top - wrapperRect.top) + (matchRect.height / 2);
            
            // Calculate pan distance
            const scale = 3.5;
            const translateX = (window.innerWidth / 2) - (centerX * scale);
            const translateY = (window.innerHeight / 2) - (centerY * scale);
            
            // Fire the zoom smoothly
            zoomWrapper.style.transition = 'transform 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
            zoomWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }, 50);
    }
    
    function zoomOut() {
        zoomWrapper.style.transition = 'transform 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
        zoomWrapper.style.transform = `translate(0px, 0px) scale(1)`;
    }

    let nukeClicks = 0;
    function handleNuke() {
        if(nukeClicks === 0) {
            document.getElementById('btn-nuke').innerText = "CONFIRM NUKE?";
            nukeClicks++; setTimeout(() => { nukeClicks = 0; document.getElementById('btn-nuke').innerText = "⚠️ NUKE BRACKET"; }, 3000);
        } else {
            document.body.classList.add('nuke-active');
            setTimeout(() => { document.body.classList.remove('nuke-active'); initializeTournament(); }, 1500);
            nukeClicks = 0;
        }
    }

    let globalState = null;
    let calculatingWinner = false;

    function handleMainAction() {
        if(!globalState) return;
        
        if(globalState.phase === "REGISTRATION") {
            db.ref('tournament/phase').set("BRACKET");
        } else if (globalState.phase === "BRACKET") {
            let m = globalState.matches[globalState.currentMatchId];
            if(m.t1.includes("Waiting") || m.t2.includes("Waiting")) { alert("Cannot start. Waiting on previous matches."); return; }
            db.ref('tournament/phase').set("VOTING");
        } else if (globalState.phase === "REVEAL") {
            // Disabled manual click here! The new Auto-Loop handles this completely.
            console.log("Auto-advancing currently engaged...");
        } else if (globalState.phase === "CHAMPION_CELEBRATION") {
            db.ref('tournament/phase').set("PATH_HIGHLIGHT");
        }
    }

    let lastPhase = "";
    let lastMatchId = -1;

    db.ref('tournament').on('value', (snapshot) => {
      const data = snapshot.val();
      if(!data) return;
      globalState = data;

      // 1. Setup Control Button based on Phase
      let actionBtn = document.getElementById('btn-main-action');
      let nukeBtn = document.getElementById('btn-nuke');
      
      actionBtn.style.display = "block"; 
      nukeBtn.style.display = "block"; // ALWAYS SHOW NUKE BUTTON as an escape hatch
      
      if(data.phase === "REGISTRATION") {
          actionBtn.innerText = "START TOURNAMENT"; 
          document.getElementById('main-title').innerText = `REGISTRATION OPEN - ${Object.keys(data.users || {}).length} Joined`;
      } else if(data.phase === "BRACKET") {
          actionBtn.innerText = "ZOOM IN & START VOTE"; 
          document.getElementById('main-title').innerText = "LION MADNESS '26";
      } else if(data.phase === "REVEAL") {
          actionBtn.innerText = "AUTO-ADVANCING...";
      } else if(data.phase === "CHAMPION_CELEBRATION") {
          actionBtn.innerText = "SHOW GLORY PATH";
      } else {
          actionBtn.style.display = "none"; 
      }

      // 2. Render Bracket visually
      data.matches.forEach((m, i) => {
          let box = document.getElementById(`match-${i}`);
          if(box) {
              document.getElementById(`m${i}-t1-name`).innerText = m.t1;
              document.getElementById(`m${i}-t1-img`).src = getImageUrl(m.t1);
              document.getElementById(`m${i}-t2-name`).innerText = m.t2;
              document.getElementById(`m${i}-t2-img`).src = getImageUrl(m.t2);
              box.className = 'match-box';
              document.getElementById(`m${i}-t1-box`).classList.remove('winner-text'); document.getElementById(`m${i}-t2-box`).classList.remove('winner-text');
              if (i === data.currentMatchId) box.classList.add('active-match');
              if (m.winner) {
                  box.classList.add('completed');
                  if(m.winner === m.t1) document.getElementById(`m${i}-t1-box`).classList.add('winner-text');
                  if(m.winner === m.t2) document.getElementById(`m${i}-t2-box`).classList.add('winner-text');
              }
          }
      });

      // 3. Render Committee Panel
      let cPanel = document.getElementById('committee-panel');
      cPanel.innerHTML = "";
      Object.keys(data.users || {}).forEach(uid => {
          let name = data.users[uid];
          let vote = (data.votes && data.votes[uid]) ? data.votes[uid] : null;
          let css = "", text = "WAITING";
          if(vote && !vote.locked) { css = "thinking"; text = "SELECTED..."; }
          if(vote && vote.locked) { css = "locked"; text = "LOCKED IN"; }
          cPanel.innerHTML += `<div class="voter-card ${css}"><b>${name}</b> <span style="font-size:0.6em">${text}</span></div>`;
      });

      if(data.phase === "VOTING" && data.users) {
          let userIds = Object.keys(data.users);
          let allLocked = true; let t1Votes = 0, t2Votes = 0;
          
          userIds.forEach(uid => {
              let v = (data.votes || {})[uid];
              if(!v || !v.locked) allLocked = false;
              else { if(v.team === 1) t1Votes++; if(v.team === 2) t2Votes++; }
          });

          // TV Auto-Triggers Winner when all registered players lock in
          if(allLocked && userIds.length > 0 && !calculatingWinner) {
              calculatingWinner = true;
              let activeMatch = data.matches[data.currentMatchId];
              let winner = t1Votes > t2Votes ? activeMatch.t1 : activeMatch.t2;
              if(t1Votes === t2Votes) winner = activeMatch.t1; // Tie break default

              db.ref(`tournament/matches/${activeMatch.id}/winner`).set(winner);
              if(activeMatch.nextMatch !== undefined) db.ref(`tournament/matches/${activeMatch.nextMatch}/${activeMatch.nextSlot}`).set(winner);
              
              if(activeMatch.id === 66) {
                  db.ref('tournament/phase').set('CHAMPION_CELEBRATION');
              } else {
                  db.ref('tournament/phase').set('REVEAL');
                  
                  // THE AUTO-ADVANCEMENT LOOP
                  // 1. Wait 5 seconds in REVEAL phase to celebrate winner
                  setTimeout(() => {
                      db.ref('tournament').update({ currentMatchId: data.currentMatchId + 1, phase: "BRACKET", votes: null });
                      
                      // 2. Wait 4 seconds in BRACKET phase to show the updated board, then auto-zoom to next vote!
                      setTimeout(() => {
                          db.ref('tournament/phase').set('VOTING');
                      }, 4000);
                      
                  }, 5000);
              }
              
              setTimeout(() => { calculatingWinner = false; }, 2000);
          }
      }

      if (data.phase !== lastPhase || data.currentMatchId !== lastMatchId) {
          const activeMatch = data.matches[data.currentMatchId];
          document.getElementById('champion-screen').classList.remove('active');

          if(data.phase === "REGISTRATION") {
              document.getElementById('matchup-view').classList.remove('visible');
              document.querySelectorAll('.match-box').forEach(el => { el.classList.remove('dimmed'); el.classList.remove('champ-path'); });
              zoomOut();
          }

          if(data.phase === "BRACKET") {
              document.getElementById('matchup-view').classList.remove('visible');
              if (lastPhase === "REVEAL") { zoomToMatch(lastMatchId); setTimeout(() => zoomOut(), 300); } 
              else { zoomOut(); }
          }
          
          if(data.phase === "VOTING") {
              document.getElementById('name-active-t1').innerText = activeMatch.t1; document.getElementById('img-active-t1').src = getImageUrl(activeMatch.t1);
              document.getElementById('name-active-t2').innerText = activeMatch.t2; document.getElementById('img-active-t2').src = getImageUrl(activeMatch.t2);
              document.getElementById('active-t1').classList.remove('winner-highlight'); document.getElementById('active-t2').classList.remove('winner-highlight');
              document.getElementById('arena-title').innerText = "VOTING OPEN";
              zoomToMatch(data.currentMatchId); setTimeout(() => { document.getElementById('matchup-view').classList.add('visible'); }, 1500);
          }

          if(data.phase === "REVEAL") {
              document.getElementById('arena-title').innerText = "ALPHA CROWNED";
              let sfx = document.getElementById('cheer-sfx'); sfx.currentTime = 0; sfx.play().catch(e=>console.log(e));
              if(activeMatch.winner === activeMatch.t1) document.getElementById('active-t1').classList.add('winner-highlight');
              else document.getElementById('active-t2').classList.add('winner-highlight');
          }

          if(data.phase === "CHAMPION_CELEBRATION") {
              document.getElementById('matchup-view').classList.remove('visible');
              document.getElementById('champ-name').innerText = activeMatch.winner;
              document.getElementById('champ-img').src = getImageUrl(activeMatch.winner);
              let sfx = document.getElementById('cheer-sfx'); sfx.currentTime = 0; sfx.play().catch(e=>console.log(e));
              setTimeout(() => { document.getElementById('champion-screen').classList.add('active'); }, 500);
          }

          if(data.phase === "PATH_HIGHLIGHT") {
              zoomOut();
              let champ = data.matches[66].winner;
              document.querySelectorAll('.match-box').forEach(el => el.classList.add('dimmed'));
              data.matches.forEach(m => {
                  if(m.t1 === champ || m.t2 === champ) {
                      let box = document.getElementById(`match-${m.id}`);
                      box.classList.remove('dimmed');
                      if(m.winner === champ) box.classList.add('champ-path');
                  }
              });
          }

          lastPhase = data.phase; lastMatchId = data.currentMatchId;
      }
    });
  </script>
</body>
</html>
